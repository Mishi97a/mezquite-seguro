<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Módulo de entrenamiento bilingüe para trabajar con mezquite, herbicida y maquinaria junto a paneles solares.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mezquite Seguro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky field-sign header + hazard stripe, a numbered route of 7 stops, one stop on screen at a time */
:root {
  --bg: #EEF2EE;
  --surface: #FFFFFF;
  --sunk: #E2E8E3;
  --ink: #16222A;
  --muted: #4E5C64;
  --line: #CBD4CE;
  --orange: #D9520B;
  --orange-soft: #FCE6D8;
  --solar: #1E4B74;
  --solar-soft: #DCE8F3;
  --olive: #53652A;
  --good: #22704A;
  --good-soft: #DDF1E5;
  --bad: #A92A20;
  --bad-soft: #F8E0DD;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --fs: 1;
  --sky: #CFE3EE; --sun: #F4B740; --soil: #D9C7A3; --panel: #22466B; --panel-line: #7C9BBA;
  --canopy: #657A30; --canopy2: #7F9548; --trunk: #6A4A2E; --skin: #B9825A; --hat: #F2C230;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161B; --surface: #172128; --sunk: #1F2B33; --ink: #E8EEF0; --muted: #A0AEB5; --line: #2D3B44;
    --orange: #FF7C35; --orange-soft: #3A2417; --solar: #8DBCE8; --solar-soft: #1A2C3D; --olive: #AFC373;
    --good: #63C990; --good-soft: #15301F; --bad: #FF8D82; --bad-soft: #3A1B19; color-scheme: dark;
    --sky: #1B2C3A; --sun: #E0A43A; --soil: #3B3326; --panel: #2B5885; --panel-line: #86A8C9;
    --canopy: #5E722D; --canopy2: #73893F; --trunk: #8A6440; --hat: #E8B92A;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161B; --surface: #172128; --sunk: #1F2B33; --ink: #E8EEF0; --muted: #A0AEB5; --line: #2D3B44;
  --orange: #FF7C35; --orange-soft: #3A2417; --solar: #8DBCE8; --solar-soft: #1A2C3D; --olive: #AFC373;
  --good: #63C990; --good-soft: #15301F; --bad: #FF8D82; --bad-soft: #3A1B19; color-scheme: dark;
  --sky: #1B2C3A; --sun: #E0A43A; --soil: #3B3326; --panel: #2B5885; --panel-line: #86A8C9;
  --canopy: #5E722D; --canopy2: #73893F; --trunk: #8A6440; --hat: #E8B92A;
}
:root[data-contrast="high"] { --muted: var(--ink); --line: var(--ink); }
:root[data-size="large"] { --fs: 1.2; }

html { font-size: calc(16px * var(--fs)); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; letter-spacing: .04em; margin-right: auto; }
.brand span { color: var(--orange); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { background: transparent; border: 1.5px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 6px; padding: 5px 10px; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.tbtn[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #16222A; }
.tbtn svg { width: 16px; height: 16px; }
.stripe { height: 10px; background: repeating-linear-gradient(-45deg, var(--orange) 0 14px, var(--ink) 14px 28px); }

/* Route nav */
.route { overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); }
.route ol { list-style: none; display: flex; gap: 4px; margin: 0; padding: 10px 0; min-width: max-content; }
.route button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 700; color: var(--muted); }
.route button[aria-current="step"] { background: var(--sunk); color: var(--ink); }
.route .num { font-family: var(--f-mono); width: 26px; height: 26px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: .78rem; }
.route .done .num { background: var(--good); border-color: var(--good); color: var(--surface); }
.progress { height: 4px; background: var(--sunk); }
.progress i { display: block; height: 100%; background: var(--good); width: 0; transition: width .4s; }

main { padding-block: 28px 56px; }
.section { display: grid; gap: 22px; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); }
.h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); font-weight: 800; text-transform: uppercase; }
.h2 { font-size: 1.7rem; font-weight: 700; }
.h3 { font-size: 1.3rem; font-weight: 700; }
.lead { font-size: 1.15rem; max-width: 62ch; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Callouts */
.exp { border: 2px dashed var(--solar); background: var(--solar-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
.exp b { font-family: var(--f-display); font-size: 1.15rem; text-transform: uppercase; color: var(--solar); letter-spacing: .03em; }
.rule { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 14px 18px; display: flex; gap: 14px; align-items: center; }
.rule .tag { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; background: var(--orange); color: #16222A; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.rule p { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; line-height: 1.15; }

/* Hero */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: stretch; }
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 12px; align-content: start; }
.why { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.why li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.why .dot { width: 28px; height: 28px; border-radius: 6px; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font-weight: 700; font-family: var(--f-mono); font-size: .8rem; }
.paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.path { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.path:hover { border-color: var(--orange); }
.path strong { font-family: var(--f-display); font-size: 1.2rem; }
.path span { color: var(--muted); font-size: .92rem; }

/* PPE */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ppe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ppe button { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; min-height: 150px; position: relative; }
.ppe button svg { width: 34px; height: 34px; color: var(--solar); }
.ppe button .name { font-weight: 700; line-height: 1.25; }
.ppe button .chk { font-size: .85rem; color: var(--muted); }
.ppe button.off { opacity: .4; }
.ppe button[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); }
.ppe button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--good); color: var(--surface); display: grid; place-items: center; font-weight: 700; }
.status { border-radius: 10px; padding: 12px 16px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.status.wait { background: var(--orange-soft); color: var(--ink); }
.status.ok { background: var(--good-soft); color: var(--good); }

/* Checklists */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks button { width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; }
.checks .box { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 700; color: transparent; }
.checks button[aria-pressed="true"] { border-color: var(--good); }
.checks button[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--surface); }
.scene-sm { width: 100%; height: auto; max-width: 360px; }
.item .tick { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; color: var(--surface); font-weight: 700; }
.item.on .tick { background: var(--good); border-color: var(--good); }
.nowork { border: 3px solid var(--bad); border-radius: 12px; padding: 14px 16px 14px 22px; display: grid; gap: 4px; background: var(--bad-soft); position: relative; overflow: hidden; }
.nowork::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(-45deg, var(--bad) 0 8px, var(--surface) 8px 16px); }
.nowork strong { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.1; text-transform: uppercase; color: var(--bad); }
.heat { border-left: 6px solid var(--bad); background: var(--surface); border-radius: 0 10px 10px 0; padding: 14px 18px; display: grid; gap: 8px; }
.heat ul { margin: 0; padding-left: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 16px; }
.turn { display: grid; gap: 4px; }
.lab2 { font-size: .85rem; font-weight: 700; color: var(--muted); }
textarea { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; resize: vertical; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
.stagep { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; justify-items: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.avatar { width: 100%; max-width: 250px; height: auto; }
.timer { font-family: var(--f-mono); font-size: 2.4rem; font-variant-numeric: tabular-nums; line-height: 1; }
.hud { display: flex; justify-content: space-between; width: 100%; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--f-mono); font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--sunk); justify-self: start; width: fit-content; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--orange-soft); color: var(--ink); }
.closet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.item { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; font-weight: 700; line-height: 1.25; }
.item svg { width: 30px; height: 30px; color: var(--solar); }
.item:hover:not([disabled]) { border-color: var(--orange); }
.item[disabled] { cursor: default; }
.item.on { border-color: var(--good); background: var(--good-soft); }
.item.on svg { color: var(--good); }
.item.pend { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.confirm { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.confirm .btn { background: var(--orange); color: #16222A; }
.confirm .btn.alt { background: transparent; color: var(--bg); border-color: var(--bg); }
.result { border: 3px solid var(--good); background: var(--good-soft); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
.result .warn { background: var(--orange-soft); border-radius: 8px; padding: 8px 12px; }
.week { display: flex; gap: 6px; flex-wrap: wrap; }
.week span { width: 40px; text-align: center; font-size: .72rem; color: var(--muted); display: grid; gap: 3px; }
.week i { display: block; height: 10px; border-radius: 3px; background: var(--line); }
.week .y i { background: var(--good); }
.pop { animation: pop .45s ease; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
.sign { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.sign.ok { border-color: var(--good); background: var(--good-soft); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sign .who { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 700; color: var(--muted); }
select { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.checks button.auto { cursor: default; }
.checks button.lock { border-style: dashed; border-color: var(--orange); }
.checks small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
.counter { font-family: var(--f-mono); font-size: .9rem; color: var(--muted); }

/* Tool tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tab { border: 0; background: transparent; padding: 10px 14px; font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--orange); }
.morning { background: var(--surface); border: 3px solid var(--orange); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.morning.ok { border-color: var(--good); }
.progress.big { height: 10px; border-radius: 5px; overflow: hidden; }
.forms { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.forms li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.forms .box { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; font-weight: 700; }
.forms li.done .box { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.sm { padding: 6px 14px; font-size: .9rem; }
.warn-line { background: var(--orange-soft); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.daygrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.water { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: center; }
.drop { width: 100%; height: auto; }
.stop.contact li { border-top-color: var(--orange); }
.stop.contact li::before { color: var(--orange); }
.report .repgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.report input[type="text"] { width: 100%; }
.tickrow { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.tickrow input { width: 20px; height: 20px; accent-color: var(--good); }
.issues { margin: 0; padding: 10px 14px 10px 30px; background: var(--orange-soft); border-radius: 8px; display: grid; gap: 4px; }
#rep-text { font-family: var(--f-mono); font-size: .85rem; }
.notify { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 2px; user-select: text; }
.lessons { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.lessons .do ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.maint { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.maint > div { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--solar); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.maint ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: var(--orange); line-height: 1; }
.steps b { display: block; }

/* Quiz */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.q .qtext { font-weight: 700; font-size: 1.08rem; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; }
.opt .k { font-family: var(--f-mono); width: 28px; height: 28px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; font-size: .85rem; }
.opt:hover:not([disabled]) { border-color: var(--solar); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.fb { border-radius: 8px; padding: 10px 14px; font-size: .95rem; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.score { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; line-height: 1; }
.badge { border: 3px solid var(--good); border-radius: 14px; padding: 20px; display: grid; gap: 10px; background: var(--good-soft); }
.badge.retry { border-color: var(--orange); background: var(--orange-soft); }

/* Accident */
.stop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; counter-reset: a; list-style: none; padding: 0; margin: 0; }
.stop li { counter-increment: a; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--bad); border-radius: 10px; padding: 14px; display: grid; gap: 4px; align-content: start; }
.stop li::before { content: counter(a); font-family: var(--f-display); font-size: 2rem; font-weight: 800; color: var(--bad); line-height: 1; }
.stop b { font-family: var(--f-display); font-size: 1.3rem; text-transform: uppercase; }
.types { display: grid; gap: 8px; }
details.type { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.type summary { padding: 12px 16px; font-weight: 700; cursor: pointer; list-style-position: outside; }
details.type[open] summary { border-bottom: 1px solid var(--line); }
.do { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.do > div { padding: 12px 16px; display: grid; gap: 4px; }
.do .y { border-right: 1px solid var(--line); }
.do .lab { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
.do .y .lab { color: var(--good); }
.do .n .lab { color: var(--bad); }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.phone { background: var(--bad); color: #fff; border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.phone .lab { font-size: .85rem; opacity: .9; }
.phone .nb { font-family: var(--f-mono); font-size: 1.5rem; user-select: all; }
.near { border-left: 6px solid var(--orange); background: var(--surface); border-radius: 0 10px 10px 0; padding: 14px 18px; display: grid; gap: 8px; }
.near ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; position: relative; padding-bottom: 18px; }
.tl li::before { content: ""; position: absolute; left: 21px; top: 36px; bottom: 0; width: 2px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl .n { width: 44px; height: 36px; border-radius: 8px; background: var(--solar); color: var(--surface); font-family: var(--f-mono); display: grid; place-items: center; font-size: .9rem; }
.tl .when { font-family: var(--f-mono); font-size: .78rem; color: var(--orange); letter-spacing: .05em; }

/* Glossary */
.gloss { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.term .en { font-family: var(--f-mono); color: var(--solar); font-size: .95rem; }
.term .es { font-weight: 700; }
.term .d { color: var(--muted); font-size: .92rem; }
.udl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.udl > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.udl b { font-family: var(--f-display); font-size: 1.2rem; }

/* Pager */
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 700; font-size: 1rem; background: var(--ink); color: var(--bg); }
.btn.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn.go { background: var(--orange); color: #16222A; }
a { color: var(--solar); font-weight: 700; }
input[type="text"] { font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: min(100%, 320px); }

/* Intro video + example images */
.video { background: var(--ink); border-radius: 14px; overflow: hidden; display: grid; }
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--sky); }
.stage .scene { position: absolute; inset: 0; width: 100%; height: 100%; animation: fade .7s ease; }
.overlay { position: absolute; left: 0; right: 0; top: 0; padding: 4% 5%; display: grid; gap: 4px; pointer-events: none; }
.overlay .vt { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: clamp(1.6rem, 6vw, 3.4rem); line-height: .95; color: var(--ink); }
.overlay .vt span { color: var(--orange); }
.overlay .vs { font-family: var(--f-mono); font-size: clamp(.7rem, 1.8vw, .9rem); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.bigplay { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); border: 0; border-radius: 999px; background: var(--orange); color: #16222A; font-weight: 700; font-size: 1.1rem; padding: 14px 26px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.bigplay svg { width: 20px; height: 20px; }
.cap { color: #F3F5F1; background: var(--ink); padding: 12px 18px; min-height: 3.4em; font-size: 1.05rem; line-height: 1.45; }
.cap[hidden] { display: none !important; }
.vbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px; background: var(--ink); flex-wrap: wrap; }
.vbtn { background: transparent; border: 1.5px solid #5B6A73; color: #F3F5F1; border-radius: 6px; padding: 5px 10px; font-size: .85rem; font-weight: 700; min-width: 38px; }
.vbtn[aria-pressed="true"] { background: #F3F5F1; color: #16222A; border-color: #F3F5F1; }
.vdots { display: flex; gap: 4px; flex: 1; min-width: 120px; }
.vdots button { flex: 1; height: 6px; border: 0; border-radius: 3px; background: #44525B; padding: 0; }
.vdots button.on { background: var(--orange); }
.vdots button.seen { background: #9AA7AE; }
.vtime { font-family: var(--f-mono); font-size: .8rem; color: #C3CDD2; }
.fig { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sky); }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { background: var(--surface); padding: 8px 14px; font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); }
.fig figcaption b { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); margin-right: 6px; }
.zone { animation: march 1.2s linear infinite; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes march { to { stroke-dashoffset: -24; } }

@media (max-width: 760px) {
  .hero, .split { grid-template-columns: 1fr; }
  .paths, .udl { grid-template-columns: 1fr; }
  .game, .maint, .report .repgrid, .daygrid { grid-template-columns: 1fr; }
  .water { grid-template-columns: 80px 1fr; }
  .stagep { position: static; }
  .avatar { max-width: 190px; }
  .ppe { grid-template-columns: repeat(2, 1fr); }
  .stop { grid-template-columns: 1fr 1fr; }
  .gloss { grid-template-columns: 1fr; }
  .do { grid-template-columns: 1fr; }
  .do .y { border-right: 0; border-bottom: 1px solid var(--line); }
  .rule { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

function go(id) {

/* Read aloud */
let speaking = false;
const canSpeak = 'speechSynthesis' in window;
if (!canSpeak) document.getElementById('b-listen').hidden = true;
function stopSpeak() { if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } speaking = false; const t = document.getElementById('t-listen'); if (t) t.textContent = L(T.ui.listen); }
function speak() {
  if (!canSpeak) return;
  if (speaking) { stopSpeak(); return; }
  try {
    const text = document.querySelector('#main .section').innerText.replace(/\s+\n/g, '\n');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang === 'es' ? 'es-MX' : 'en-US';
    u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(S.lang));
    if (v) u.voice = v;
    u.onend = u.onerror = () => stopSpeak();
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    speaking = true;
    document.getElementById('t-listen').textContent = L(T.ui.stop);
  } catch (e) { stopSpeak(); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.v) return vControl(b);
  if (b.dataset.go) { vPause(); return go(b.dataset.go); }
  if (b.dataset.lang) { stopSpeak(); vPause(); S.lang = b.dataset.lang; return render(); }
  if (b.id === 'b-listen') { vPause(); return speak(); }
  if (b.id === 'b-size') { S.size = !S.size; return render(); }
  if (b.id === 'b-contrast') { S.contrast = !S.contrast; return render(); }
  if (b.dataset.task) { if (S.task !== b.dataset.task) { delete S.sign.start; S.task = b.dataset.task; S.game = freshGame(S.task); } return render(); }
  if (b.dataset.gstart) { S.game = freshGame(S.task); S.game.start = Date.now(); return render(); }
  if (b.dataset.item) { if (!S.game.start) S.game.start = Date.now(); S.game.pending = b.dataset.item; return render(); }
  if (b.dataset.gno) { S.game.pending = null; return render(); }
  if (b.dataset.gyes) {
    const G = S.game;
    G.placed[b.dataset.gyes] = true; G.last = b.dataset.gyes; G.pending = null;
    if (need().every(p => G.placed[p.k])) {
      G.end = Date.now();
      const secs = (G.end - G.start) / 1000;
      G.record = !S.best[S.task] || secs < S.best[S.task];
      if (G.record) S.best[S.task] = secs;
      const k = todayKey();
      S.ppeLog[k] = S.ppeLog[k] || {};
      S.ppeLog[k][S.task] = {secs, at: G.end};
    }
    return render();
  }
  if (b.dataset.greset) { S.game = freshGame(S.task); return render(); }
  if (b.dataset.pitem) { pack(b.dataset.pitem).pending = b.dataset.k; return render(); }
  if (b.dataset.pno) { pack(b.dataset.pno).pending = null; return render(); }
  if (b.dataset.pyes) {
    const id = b.dataset.pyes, P = pack(id), items = PACKS[id];
    P.placed[b.dataset.k] = true; P.last = b.dataset.k; P.pending = null;
    if (items.every(x => P.placed[x.k])) packLog(id)[todayKey()] = Date.now();
    return render();
  }
  if (b.dataset.crewmode) { S.crew.mode = b.dataset.crewmode; return render(); }
  if (b.dataset.water) { dayState().water.push(Date.now()); return render(); }
  if (b.dataset.brk) { dayState().breaks.push(Date.now()); return render(); }
  if (b.dataset.meal) { const d = dayState(); d.meal = d.meal ? 0 : Date.now(); return render(); }
  if (b.id === 'rep-copy') {
    const ta = document.getElementById('rep-text'), msg = document.getElementById('rep-msg');
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = S.lang === 'es' ? 'Texto seleccionado: cópialo con Ctrl+C o mantén presionado.' : 'Text selected: copy with Ctrl+C or long-press.'; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = S.lang === 'es' ? 'Copiado. Pégalo en el correo o mensaje.' : 'Copied. Paste it into the email or message.'; }, fallback); } catch (err) { fallback(); }
    return;
  }
  if (b.dataset.check) { const st = S[b.dataset.check]; st[b.dataset.i] = !st[b.dataset.i]; if (!st[b.dataset.i]) delete S.sign[b.dataset.check]; return render(); }
  if (b.dataset.tool) { S.tool = b.dataset.tool; return render(); }
  if (b.dataset.q !== undefined) {
    const id = b.dataset.q, i = Number(b.dataset.i);
    if (current === 'evaluacion') S.quiz[id] = i; else S.qc[id] = i;
    return render();
  }
  if (b.id === 'retry') { S.quiz = {}; return render(true); }
  if (b.dataset.sign) {
    const st = b.dataset.sign, d = S.signDraft[st] || {name: '', role: 0};
    if (!d.name.trim()) { document.getElementById('sign-msg-' + st).textContent = S.lang === 'es' ? 'Escribe el nombre del encargado.' : 'Enter the name of the person in charge.'; document.getElementById('enc-' + st).focus(); return; }
    S.sign[st] = {name: d.name.trim(), role: Number(d.role), at: Date.now()};
    return render();
  }
  if (b.dataset.unsign) { delete S.sign[b.dataset.unsign]; return render(); }
});

  if (e.target.dataset.draft) { draft(e.target.dataset.draft).name = e.target.value; save(); }
  if (e.target.dataset.crew) { S.crew.names = e.target.value; save(); }
  if (e.target.dataset.rep) { S.rep[e.target.dataset.rep] = e.target.value; save(); const o = document.getElementById('rep-out'); if (o) o.innerHTML = repOut(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.repc) { S.rep[e.target.dataset.repc] = e.target.checked; save(); const o = document.getElementById('rep-out'); if (o) o.innerHTML = repOut(); }
});
document.addEventListener('input', e => { if (e.target.dataset.crew) { const t = document.getElementById('turnbox'); if (t) t.innerHTML = turnHTML(); } });
document.addEventListener('change', e => { if (e.target.dataset.draftrole) { draft(e.target.dataset.draftrole).role = Number(e.target.value); save(); } });

setInterval(() => { const w = document.getElementById('waterbox'); if (w) w.innerHTML = waterHTML(); }, 30000);
setInterval(() => {
  const el = document.getElementById('gtime');
  if (el && S.game.start && !S.game.end) el.textContent = fmt((Date.now() - S.game.start) / 1000);
}, 100);
render();
</script>

</body>
</html>
